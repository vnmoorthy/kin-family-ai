<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="-apple-system, Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Kin architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55555F"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5B5C0"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B0B0F" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#FAFAFB"/>

  <text x="40" y="52" font-size="24" font-weight="800" fill="#0B0B0F" letter-spacing="-0.5">How Kin works</text>
  <text x="40" y="76" font-size="13" fill="#6B6B76">Every phone is a live Convex subscriber. Reasoning and memory run server-side, so the whole family updates at once.</text>

  <!-- ================= Family phones ================= -->
  <g filter="url(#soft)">
    <rect x="40" y="110" width="220" height="440" rx="22" fill="#FFFFFF" stroke="#E5E5EA"/>
  </g>
  <text x="60" y="140" font-size="15" font-weight="800" fill="#0B0B0F">Family phones</text>
  <text x="60" y="158" font-size="11" fill="#8E8E96">Expo · React Native · expo-router</text>

  <g>
    <rect x="58" y="174" width="184" height="80" rx="16" fill="#F5F5F7"/>
    <circle cx="88" cy="214" r="18" fill="#FF6B4A"/>
    <text x="88" y="220" font-size="17" text-anchor="middle">👩</text>
    <text x="115" y="209" font-size="13" font-weight="800" fill="#0B0B0F">Sarah · Mom</text>
    <text x="115" y="226" font-size="10.5" fill="#6B6B76">“we're out of eggs”</text>

    <rect x="58" y="262" width="184" height="80" rx="16" fill="#F5F5F7"/>
    <circle cx="88" cy="302" r="18" fill="#4A7DFF"/>
    <text x="88" y="308" font-size="17" text-anchor="middle">👨</text>
    <text x="115" y="297" font-size="13" font-weight="800" fill="#0B0B0F">Mike · Dad</text>
    <text x="115" y="314" font-size="10.5" fill="#6B6B76">gets the 🥚 nudge, live</text>

    <rect x="58" y="350" width="184" height="80" rx="16" fill="#F5F5F7"/>
    <circle cx="88" cy="390" r="18" fill="#2EC27E"/>
    <text x="88" y="396" font-size="17" text-anchor="middle">🧒</text>
    <text x="115" y="385" font-size="13" font-weight="800" fill="#0B0B0F">Jake · Kid</text>
    <text x="115" y="402" font-size="10.5" fill="#6B6B76">taps “I've got it”</text>

    <rect x="58" y="438" width="184" height="80" rx="16" fill="#F5F5F7"/>
    <circle cx="88" cy="478" r="18" fill="#B15CFF"/>
    <text x="88" y="484" font-size="17" text-anchor="middle">👵</text>
    <text x="115" y="473" font-size="13" font-weight="800" fill="#0B0B0F">Grandma · Grandma</text>
    <text x="115" y="490" font-size="10.5" fill="#6B6B76">8pm medicine reminder</text>
  </g>
  <text x="150" y="540" font-size="10" fill="#8E8E96" text-anchor="middle">each with a 🔒 private thread</text>

  <!-- ================= Convex ================= -->
  <g filter="url(#soft)">
    <rect x="340" y="110" width="440" height="440" rx="22" fill="#FFFFFF" stroke="#E5E5EA"/>
  </g>
  <circle cx="366" cy="137" r="6" fill="#F3B01C"/>
  <text x="380" y="143" font-size="18" font-weight="800" fill="#0B0B0F">Convex</text>
  <text x="760" y="142" font-size="11" fill="#8E8E96" text-anchor="end">the family's single source of truth</text>
  <line x1="360" y1="160" x2="760" y2="160" stroke="#EFEFF2"/>

  <g font-size="10.5" fill="#55555F">
    <!-- row 1 -->
    <rect x="360" y="172" width="196" height="92" rx="14" fill="#FAFAFB" stroke="#ECECF0"/>
    <text x="374" y="194" font-size="12.5" font-weight="800" fill="#0B0B0F">⚡ Live queries</text>
    <text x="374" y="212" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">items.list · messages.list</text>
    <text x="374" y="226" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">nudges.unseen</text>
    <text x="374" y="240" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">memories.visible</text>
    <text x="374" y="256">pushed to every phone instantly</text>

    <rect x="564" y="172" width="196" height="92" rx="14" fill="#FAFAFB" stroke="#ECECF0"/>
    <text x="578" y="194" font-size="12.5" font-weight="800" fill="#0B0B0F">✍️ Mutations</text>
    <text x="578" y="214" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">messages.send · items.add</text>
    <text x="578" y="230" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">items.claim · items.toggleDone</text>
    <text x="578" y="246" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">memories.setScope · ai.apply</text>

    <!-- row 2 -->
    <rect x="360" y="272" width="196" height="92" rx="14" fill="#FAFAFB" stroke="#ECECF0"/>
    <text x="374" y="294" font-size="12.5" font-weight="800" fill="#0B0B0F">🤖 Actions</text>
    <text x="374" y="314" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">ai.respond · ai.brief</text>
    <text x="374" y="330" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">memoryActions.push</text>
    <text x="374" y="346" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">whop.createCheckout</text>

    <rect x="564" y="272" width="196" height="92" rx="14" fill="#FAFAFB" stroke="#ECECF0"/>
    <text x="578" y="294" font-size="12.5" font-weight="800" fill="#0B0B0F">⏱️ Scheduler</text>
    <text x="578" y="314" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">runAfter(0, ai.respond)</text>
    <text x="578" y="330" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">runAfter(0, memoryActions.push)</text>
    <text x="578" y="350">send returns instantly</text>

    <!-- row 3 -->
    <rect x="360" y="372" width="196" height="92" rx="14" fill="#FAFAFB" stroke="#ECECF0"/>
    <text x="374" y="394" font-size="12.5" font-weight="800" fill="#0B0B0F">🗂️ File storage</text>
    <text x="374" y="414">photo snaps: fridge, flyers</text>
    <text x="374" y="430" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">generateUploadUrl → storageId</text>
    <text x="374" y="450">URL handed to vision model</text>

    <rect x="564" y="372" width="196" height="92" rx="14" fill="#FAFAFB" stroke="#ECECF0"/>
    <text x="578" y="394" font-size="12.5" font-weight="800" fill="#0B0B0F">🌐 HTTP action</text>
    <text x="578" y="414" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">POST /whop</text>
    <text x="578" y="430">payment succeeded →</text>
    <text x="578" y="446" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.2">whop.markPlus (plan: plus)</text>

    <!-- tables -->
    <rect x="360" y="474" width="400" height="60" rx="14" fill="#FFF8E8" stroke="#F6E2B0"/>
    <text x="374" y="494" font-size="11" font-weight="800" fill="#8A5A00">Tables</text>
    <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#5A4100" text-anchor="middle">
      <rect x="372" y="504" width="74" height="20" rx="10" fill="#FFFFFF" stroke="#F0D9A0"/><text x="409" y="518">households</text>
      <rect x="451" y="504" width="58" height="20" rx="10" fill="#FFFFFF" stroke="#F0D9A0"/><text x="480" y="518">members</text>
      <rect x="514" y="504" width="46" height="20" rx="10" fill="#FFFFFF" stroke="#F0D9A0"/><text x="537" y="518">items</text>
      <rect x="565" y="504" width="64" height="20" rx="10" fill="#FFFFFF" stroke="#F0D9A0"/><text x="597" y="518">messages</text>
      <rect x="634" y="504" width="64" height="20" rx="10" fill="#FFFFFF" stroke="#F0D9A0"/><text x="666" y="518">memories</text>
      <rect x="703" y="504" width="52" height="20" rx="10" fill="#FFFFFF" stroke="#F0D9A0"/><text x="729" y="518">nudges</text>
    </g>
  </g>

  <!-- ================= Right column ================= -->
  <!-- OpenAI -->
  <g filter="url(#soft)">
    <rect x="900" y="110" width="260" height="120" rx="20" fill="#FFFFFF" stroke="#E5E5EA"/>
  </g>
  <circle cx="924" cy="134" r="6" fill="#10A37F"/>
  <text x="938" y="140" font-size="15" font-weight="800" fill="#0B0B0F">OpenAI</text>
  <g font-size="11" fill="#55555F">
    <text x="918" y="164">gpt-4.1-mini (gpt-4o-mini fallback)</text>
    <text x="918" y="182">JSON mode: “decide actions”</text>
    <text x="918" y="200">vision for fridge &amp; flyer photos</text>
    <text x="918" y="218">reply + items + nudges + memories</text>
  </g>

  <!-- Supermemory -->
  <g filter="url(#soft)">
    <rect x="900" y="250" width="260" height="176" rx="20" fill="#FFFFFF" stroke="#E5E5EA"/>
  </g>
  <circle cx="924" cy="274" r="6" fill="#6E56CF"/>
  <text x="938" y="280" font-size="15" font-weight="800" fill="#0B0B0F">Supermemory</text>
  <text x="918" y="300" font-size="11" fill="#55555F">long-term memory, per family</text>
  <rect x="916" y="310" width="228" height="38" rx="12" fill="#EEF7F1"/>
  <text x="928" y="326" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#1F7A4A">kin_‹household›_family</text>
  <text x="928" y="340" font-size="9.5" fill="#3F8F63">shared, family members only</text>
  <rect x="916" y="354" width="228" height="38" rx="12" fill="#F1EEFF"/>
  <text x="928" y="370" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#4B3B9A">kin_‹household›_‹member›</text>
  <text x="928" y="384" font-size="9.5" fill="#6B5BB8">🔒 private, one per person</text>
  <text x="918" y="414" font-size="10.5" fill="#6B6B76">add (dreaming: instant) · hybrid search</text>

  <!-- Whop -->
  <g filter="url(#soft)">
    <rect x="900" y="446" width="260" height="104" rx="20" fill="#FFFFFF" stroke="#E5E5EA"/>
  </g>
  <circle cx="924" cy="470" r="6" fill="#FF6243"/>
  <text x="938" y="476" font-size="15" font-weight="800" fill="#0B0B0F">Whop</text>
  <g font-size="11" fill="#55555F">
    <text x="918" y="498">Kin Plus · $4.99/mo per family</text>
    <text x="918" y="516">hosted checkout, opened in-app</text>
    <text x="918" y="534">webhook flips plan to “plus”</text>
  </g>

  <!-- ================= Arrows ================= -->
  <g stroke="#55555F" stroke-width="1.6" fill="none">
    <!-- phones <-> convex -->
    <line x1="262" y1="296" x2="336" y2="296" marker-end="url(#arrow)"/>
    <line x1="338" y1="336" x2="264" y2="336" marker-end="url(#arrow)"/>
    <!-- convex <-> openai -->
    <line x1="782" y1="156" x2="896" y2="156" marker-end="url(#arrow)"/>
    <line x1="898" y1="190" x2="784" y2="190" marker-end="url(#arrow)"/>
    <!-- convex <-> supermemory -->
    <line x1="782" y1="318" x2="896" y2="318" marker-end="url(#arrow)"/>
    <line x1="898" y1="352" x2="784" y2="352" marker-end="url(#arrow)"/>
    <!-- convex <-> whop -->
    <line x1="782" y1="482" x2="896" y2="482" marker-end="url(#arrow)"/>
    <line x1="898" y1="516" x2="784" y2="516" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10.5" font-weight="600" fill="#3A3A42" text-anchor="middle">
    <text x="300" y="288">mutations</text>
    <text x="300" y="352">live updates</text>
    <text x="300" y="365" font-weight="400" fill="#8E8E96">(websocket)</text>
    <text x="840" y="148">prompt + photo</text>
    <text x="840" y="206">JSON actions</text>
    <text x="840" y="310">facts + chats</text>
    <text x="840" y="368">semantic recall</text>
    <text x="840" y="474">create checkout</text>
    <text x="840" y="532">webhook</text>
  </g>

  <!-- ================= Dev loop ================= -->
  <rect x="40" y="582" width="1120" height="124" rx="22" fill="#0B0B0F"/>
  <text x="64" y="614" font-size="14" font-weight="800" fill="#FFFFFF">Dev loop</text>
  <text x="64" y="634" font-size="10.5" fill="#9A9AA6">how Kin was built and</text>
  <text x="64" y="649" font-size="10.5" fill="#9A9AA6">tested in one day</text>

  <rect x="300" y="596" width="240" height="72" rx="16" fill="#1C1C22" stroke="#33333D"/>
  <text x="318" y="621" font-size="14" font-weight="800" fill="#FFFFFF">Capy</text>
  <text x="318" y="640" font-size="10.5" fill="#B5B5BD">AI software engineer</text>
  <text x="318" y="656" font-size="10.5" fill="#B5B5BD">builds and iterates features as PRs</text>

  <rect x="610" y="596" width="190" height="72" rx="16" fill="#1C1C22" stroke="#33333D"/>
  <text x="628" y="621" font-size="14" font-weight="800" fill="#FFFFFF">GitHub</text>
  <text x="628" y="640" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#B5B5BD">kin-family-ai</text>
  <text x="628" y="656" font-size="10.5" fill="#B5B5BD">PRs land on main</text>

  <rect x="870" y="596" width="270" height="72" rx="16" fill="#1C1C22" stroke="#33333D"/>
  <text x="888" y="621" font-size="14" font-weight="800" fill="#FFFFFF">Revyl</text>
  <text x="888" y="640" font-size="10.5" fill="#B5B5BD">runs Kin on cloud iOS devices</text>
  <text x="888" y="656" font-size="10.5" fill="#B5B5BD">natural-language end-to-end tests</text>

  <g stroke="#B5B5C0" stroke-width="1.6" fill="none">
    <line x1="542" y1="632" x2="606" y2="632" marker-end="url(#arrowLight)"/>
    <line x1="802" y1="632" x2="866" y2="632" marker-end="url(#arrowLight)"/>
    <path d="M1005,670 V692 H420 V674" marker-end="url(#arrowLight)"/>
  </g>
  <g font-size="10" fill="#9A9AA6" text-anchor="middle">
    <text x="574" y="624">PR</text>
    <text x="834" y="624">build</text>
    <text x="712" y="686">failing test → next PR</text>
  </g>
</svg>
