project:
    id: a63beb53-419f-4841-9994-28a8c3b20863
session:
    idle_timeout_seconds: 1800
build:
    framework: expo
    env:
        CI: "1"
        EXPO_PUBLIC_CONVEX_URL: https://frugal-tiger-389.convex.cloud
        EXPO_PUBLIC_CONVEX_SITE_URL: https://frugal-tiger-389.convex.site
    profiles:
        development:
            ios:
                app_id: c0b8a79d-4266-4e5b-88eb-e2d3f2f9af7f
                setup_commands:
                    - npm install
                    - if [ ! -d ios ]; then npx expo prebuild --platform ios --no-install; fi
                build_commands:
                    - cd ios && if [ ! -d Pods ]; then pod install; fi && WS=$(ls -d *.xcworkspace | head -n 1) && xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath build
                output_path: ios/build/Build/Products/Debug-iphonesimulator/*.app
        preview:
            ios:
                app_id: c0b8a79d-4266-4e5b-88eb-e2d3f2f9af7f
                setup_commands:
                    - npm install
                    - if [ ! -d ios ]; then npx expo prebuild --platform ios --no-install; fi
                build_commands:
                    - cd ios && if [ ! -d Pods ]; then pod install; fi && WS=$(ls -d *.xcworkspace | head -n 1) && xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath build
                output_path: ios/build/Build/Products/Release-iphonesimulator/*.app
pr_review:
    enabled: true
    build:
        kind: revyl
        profile: preview
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
